<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="500" viewBox="0 0 1440 500" role="img" aria-labelledby="title desc">
<title id="title">AgriSwarm — локальная автоматика на ESP32</title>
<desc id="desc">Схематическое изображение сети узлов рядом с названием проекта. Датчики, правила и действия работают вместе. Иллюстрация не является фотографией оборудования.</desc>
<defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#234e45" stroke-width="1"/></pattern><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#112f2a"/><stop offset="1" stop-color="#081d1b"/></linearGradient></defs>
<rect width="1440" height="500" rx="22" fill="url(#bg)"/>
<rect x="770" width="670" height="500" rx="22" fill="url(#grid)" opacity=".6"/>
<g font-family="Segoe UI,Arial,sans-serif">
<rect x="64" y="54" width="282" height="36" rx="18" fill="#234c3e"/>
<text x="84" y="78" fill="#b2e4b8" font-size="16" letter-spacing="2">ДОКУМЕНТАЦИЯ ПРОЕКТА</text>
<text x="60" y="194" fill="#f5f4e9" font-size="88" font-weight="700" letter-spacing="-3">AgriSwarm</text>
<text x="65" y="256" fill="#e3eddf" font-size="33">Локальная автоматика на ESP32</text>
<text x="65" y="308" fill="#acc6ba" font-size="23">Датчики. Правила. Согласованные действия.</text>
<path d="M65 358H685" stroke="#365a4e"/>
<text x="65" y="406" fill="#c2d8c8" font-size="21">Одна плата или несколько связанных узлов</text>
<text x="65" y="443" fill="#9fbdad" font-size="20">Локальные сценарии без обязательного интернета</text>
</g>
