<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title">
<title id="title">Датчик измеряет, плата ESP32 проверяет правило, выход управляет устройством. Другие платы связаны по радио.</title>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071925"/><stop offset="1" stop-color="#082a2b"/></linearGradient>
 <linearGradient id="accent"><stop stop-color="#b5ed7b"/><stop offset="1" stop-color="#4bd5ca"/></linearGradient>
 <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#32565b" stroke-width="0.5" opacity=".35"/></pattern>
</defs>
<rect width="1200" height="440" rx="22" fill="url(#bg)"/>
<rect width="1200" height="440" rx="22" fill="url(#grid)"/>
<g font-family="Segoe UI,Arial,sans-serif" fill="#eef8f6"><text x="44" y="52" font-size="20" fill="#a9d1cb" font-weight="600" >AGRISWARM  /  ПРИНЦИП РАБОТЫ</text><text x="44" y="108" font-size="40" fill="#eef8f6" font-weight="600" >От измерения к действию</text><rect x="44" y="152" width="324" height="162" rx="16" fill="#0c2833" stroke="#285058"/><text x="66" y="194" font-size="22" fill="#a6ed8a" font-weight="600" >01</text><text x="66" y="243" font-size="34" fill="#eef8f6" font-weight="600" >Датчик</text><text x="66" y="282" font-size="22" fill="#b8d1d4" font-weight="400" >Измеряет условия</text><rect x="438" y="152" width="324" height="162" rx="16" fill="#0c2833" stroke="#285058"/><text x="460" y="194" font-size="22" fill="#a6ed8a" font-weight="600" >02</text><text x="460" y="243" font-size="34" fill="#eef8f6" font-weight="600" >ESP32</text><text x="460" y="282" font-size="22" fill="#b8d1d4" font-weight="400" >Проверяет правило</text><rect x="832" y="152" width="324" height="162" rx="16" fill="#0c2833" stroke="#285058"/><text x="854" y="194" font-size="22" fill="#a6ed8a" font-weight="600" >03</text><text x="854" y="243" font-size="34" fill="#eef8f6" font-weight="600" >Выход</text><text x="854" y="282" font-size="22" fill="#b8d1d4" font-weight="400" >Управляет устройством</text><path d="M383 232h37m-10-9 10 9-10 9" fill="none" stroke="url(#accent)" stroke-width="3"/><path d="M777 232h37m-10-9 10 9-10 9" fill="none" stroke="url(#accent)" stroke-width="3"/><path d="M600 316v32h190" fill="none" stroke="#59c5bf" stroke-width="2" stroke-dasharray="6 6"/><text x="44" y="397" font-size="23" fill="#c0ded8" font-weight="400" >Локальное правило выполняется на плате.</text><text x="806" y="356" font-size="26" fill="#acf08c" font-weight="600" >Другие ESP32</text><text x="806" y="395" font-size="22" fill="#b8d1d4" font-weight="400" >Обмен по радиосвязи</text></g>
